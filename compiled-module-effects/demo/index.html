<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compiled keyed module request replies</title>
    <style>
      :root { color-scheme: light dark; font: 16px/1.45 system-ui, sans-serif; }
      body { margin: 0; padding: 2rem; }
      main { max-width: 72rem; margin: 0 auto; }
      header, .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
      .toolbar { margin: 1rem 0; }
      button { font: inherit; padding: .4rem .75rem; }
      #effects-modules { display: grid; gap: 1rem; }
      #effects-modules > [data-gobi-module-root] { min-width: 0; padding: 1rem; border: 1px solid #8888; border-radius: .5rem; }
      #effects-modules > [data-gobi-module-root='parent'] { background: #8881; }
      #effects-modules > [data-gobi-module-root^='child-'] { margin-left: 1.5rem; }
      pre { overflow: auto; max-height: 26rem; padding: 1rem; background: #8882; border-radius: .5rem; }
      [data-state="failed"] { color: #c33; }
      @media (max-width: 42rem) { body { padding: 1rem; } #effects-modules > [data-gobi-module-root^='child-'] { margin-left: .5rem; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Keyed Go modules with cancellable request replies</h1>
          <p>The fixture's “Save” label starts a timer that echoes its opaque token. No counter data is persisted or sent over HTTP.</p>
        </div>
        <output id="effects-status" aria-live="polite" data-state="starting">Starting…</output>
      </header>
      <div class="toolbar" aria-label="Renderer and inspection controls">
        <div>
          <button type="button" id="effects-backend-dom" data-effects-backend="dom">Use DOM renderer</button>
          <button type="button" id="effects-backend-react" data-effects-backend="react">Use React renderer</button>
        </div>
        <div>
          <button type="button" id="read-effects-snapshot">Read snapshot</button>
          <button type="button" id="read-effects-trace">Read trace</button>
        </div>
      </div>
      <section id="effects-modules" aria-label="Compiled keyed parent and effect children"></section>
      <h2>Current module snapshot</h2>
      <pre id="effects-snapshot" aria-live="polite"></pre>
      <details>
        <summary>Runtime and transport trace</summary>
        <pre id="effects-trace"></pre>
      </details>
    </main>
    <script type="module" src="./demo.bundle.mjs"></script>
  </body>
</html>
