name: Counter interaction parity

on:
  push:
  pull_request:

jobs:
  interaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            interaction/package-lock.json

      - name: Run the signed Milestone 0 check
        run: bash run.sh

      - name: Install interaction dependencies
        run: npm ci --prefix interaction --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: interaction/node_modules/.bin/playwright install --with-deps chromium

      - name: Run Go WebAssembly and React interaction parity
        run: GONDOLA_SKIP_NPM_CI=1 GONDOLA_SKIP_BROWSER_INSTALL=1 bash run-interaction.sh

      - name: Upload interaction artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-parity-artifacts
          path: |
            interaction/build/
            interaction/artifacts/
          if-no-files-found: ignore
