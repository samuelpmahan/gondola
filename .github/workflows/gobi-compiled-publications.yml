name: Gobi typed inputs and keyed publications

on:
  push:
  pull_request:

jobs:
  compiled-publications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            interaction/package-lock.json
            compiled-frontend/package-lock.json

      - name: Install existing locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix interaction --no-audit --no-fund
          npm ci --prefix compiled-frontend --no-audit --no-fund

      - name: Install Playwright Chromium
        run: interaction/node_modules/.bin/playwright install --with-deps chromium

      - name: Run typed input and keyed publication profile
        env:
          GONDOLA_SKIP_NPM_CI: "1"
          GONDOLA_SKIP_BROWSER_INSTALL: "1"
          GOFLAGS: -buildvcs=false
        run: bash run-compiled-publications.sh

      - name: Run the full PR16 inherited chain
        env:
          GONDOLA_SKIP_NPM_CI: "1"
          GONDOLA_SKIP_BROWSER_INSTALL: "1"
          GOFLAGS: -buildvcs=false
        run: bash run-compiled-children.sh

      - name: Preserve typed publication attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gobi-compiled-publications-artifacts
          path: |
            compiled-publications/demo/output/attempts/**
            compiled-publications/evidence/attempts/**
          if-no-files-found: warn
