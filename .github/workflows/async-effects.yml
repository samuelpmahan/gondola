name: Gobi async effects

on:
  push:
  pull_request:

jobs:
  async-effects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            interaction/package-lock.json

      - name: Run the signed Milestone 0 baseline
        run: bash run.sh

      - name: Install pinned interaction dependencies
        run: npm ci --prefix interaction --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: interaction/node_modules/.bin/playwright install --with-deps chromium

      - name: Run inherited and async-effects checks
        env:
          GONDOLA_SKIP_NPM_CI: "1"
          GONDOLA_SKIP_BROWSER_INSTALL: "1"
        run: bash run-async-effects.sh

      - name: Upload interaction and async-effects artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gobi-async-effects-artifacts
          path: |
            interaction/build/
            interaction/artifacts/
            backend-replacement/build/
            controlled-input/build/
            controlled-input/artifacts/
            async-effects/build/
            async-effects/artifacts/
            async-effects/evidence/
          if-no-files-found: ignore
