name: Gobi compiled value methods

on:
  push:
  pull_request:

jobs:
  compiled-methods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            interaction/package-lock.json
            compiled-frontend/package-lock.json

      - name: Install locked JavaScript dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix interaction --no-audit --no-fund
          npm ci --prefix compiled-frontend --no-audit --no-fund

      - name: Install Playwright managed Chromium
        run: interaction/node_modules/.bin/playwright install --with-deps chromium

      - name: Run inherited gates and compiled method demo
        run: bash run-compiled-methods.sh

      - name: Preserve method and inherited compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gobi-compiled-methods-artifacts
          path: |
            compiled-methods/artifacts/attempts/**
            compiled-methods/coordination/reports/E-DEMO.md
            compiled-methods/coordination/receipts/E-DEMO.json
            compiled-backends/artifacts/compiled/**
            compiled-backends/artifacts/conformance/**
            compiled-backends/artifacts/demo-smoke.json
            compiled-backends/artifacts/demo.png
            compiled-backends/artifacts/execution.json
            compiled-backends/artifacts/logs/**
            compiled-backends/coordination/reports/E-DEMO.md
            compiled-backends/coordination/receipts/E-DEMO.json
            compiled-frontend/artifacts/compiled/**
            compiled-frontend/artifacts/execution.json
            compiled-frontend/artifacts/logs/**
          if-no-files-found: warn
