name: Gobi compiled DOM and React backends

on:
  push:
  pull_request:

jobs:
  compiled-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            interaction/package-lock.json
            compiled-frontend/package-lock.json

      - name: Install locked JavaScript dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix interaction --no-audit --no-fund
          npm ci --prefix compiled-frontend --no-audit --no-fund

      - name: Install Playwright managed Chromium
        run: interaction/node_modules/.bin/playwright install --with-deps chromium

      - name: Run inherited gates and DOM/React backend matrix
        env:
          GONDOLA_SKIP_NPM_CI: "1"
          GONDOLA_SKIP_BROWSER_INSTALL: "1"
        run: bash run-compiled-backends.sh

      - name: Preserve backend build, browser, and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gobi-compiled-backends-artifacts
          path: |
            compiled-backends/artifacts/
            compiled-backends/coordination/reports/E-DEMO.md
            compiled-backends/coordination/receipts/E-DEMO.json
            compiled-frontend/artifacts/
          if-no-files-found: ignore
